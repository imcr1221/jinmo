return panel}
function render(){mainTabs.innerHTML='';subTabs.innerHTML='';content.innerHTML='';for(const c of ['大小','多少','长短','综合']){let b=document.createElement('button');b.textContent=names[c];b.className=c===category?'active':'';b.onclick=()=>{category=c;sub=c==='综合'?'练习':'学习';render()};mainTabs.append(b)}for(const s of (category==='综合'?['练习']:['学习','游戏','练习'])){let b=document.createElement('button');b.textContent=({'学习':'📖 学习','游戏':'🎮 游戏','练习':'✏️ 练习'})[s];b.className=s===sub?'active':'';b.onclick=()=>{sub=s;render()};subTabs.append(b)}let intro=document.createElement('div');intro.className='panel';intro.innerHTML='<h2 class="section-title">'+names[category]+' · '+sub+'</h2><p class="hint">'+(sub==='学习'?'先观察图片，点击物品听一听、说一说。':sub==='游戏'?'点击下面的字，看看物品怎样变化。':'先听题目，再点击图片完成练习。')+'</p><div class="speech" aria-live="polite"></div>';content.append(intro);if(sub==='游戏'){game();return}let list=CONFIG[category][sub];list.forEach(f=>content.append(scene(DATA.find(x=>x.file===f))));}
function game(){let index={'大小':0,'多少':1,'长短':2}[category];let box=document.createElement('div');box.className='panel';box.innerHTML='<h3>'+['🎈 气球大和小','🍎 苹果多和少','🧶 绳子长和短'][index]+'</h3><div class="demo" id="demo"></div><div class="controls"><button class="primary" id="increase">'+['大','多','长'][index]+'</button><button id="decrease">'+['小','少','短'][index]+'</button><button id="reset">重新开始</button></div><p class="hint">可以反复点击，听一听中文。</p>';content.append(box);let demo=box.querySelector('#demo');function draw(){if(index===0){demo.innerHTML='<div class="balloon" style="transform:scale('+balloonSize+')">🎈</div>'}else if(index===1){demo.innerHTML='<div class="apples">'+('🍎'.repeat(appleCount))+'</div>'}else demo.innerHTML='<div class="rope" style="width:'+ropeSize+'%"></div>'}function update(dir){if(index===0){balloonSize=dir>0?balloonSize*1.2:Math.max(.2,balloonSize/1.2)}else if(index===1){appleCount=Math.max(1,Math.min(20,appleCount+dir))}else ropeSize=Math.max(8,Math.min(98,ropeSize+dir*12));draw();say([['大','小'],['多','少'],['长','短']][index][dir>0?0:1])}box.querySelector('#increase').onclick=()=>update(1);box.querySelector('#decrease').onclick=()=>update(-1);box.querySelector('#reset').onclick=()=>{balloonSize=1;appleCount=3;ropeSize=50;draw()};draw()}
render();
document.getElementById('startReview').onclick=()=>{category='大小';sub='学习';render();document.getElementById('mainTabs').scrollIntoView({behavior:'smooth',block:'start'})};
document.getElementById('startHomework').onclick=()=>{category='综合';sub='练习';render();document.getElementById('mainTabs').scrollIntoView({behavior:'smooth',block:'start'})};
</script></body></html>
