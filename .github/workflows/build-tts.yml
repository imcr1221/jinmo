name: Build TTS and Deploy

on:
  push:
    paths:
      - '**/*.html'
      - '**/tts-extra.json'
      - 'generate_audio.py'
      - '.github/workflows/build-tts.yml'
  workflow_dispatch:

permissions:
  contents: write

# Avoid two runs pushing generated audio at the same time.
concurrency:
  group: build-tts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'edge-tts>=6.1.12,<7'

      - name: Generate audio and manifests
        run: timeout 1500 python generate_audio.py

      # 先提交已成功生成的音频，再检查缺失；
      # 这样即使有少量条目失败，其余音频也能落库，重跑只补缺失部分。
      - name: Commit and push generated audio files
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          # 跨目录匹配所有 */audio/** 下的文件（Git 原生 glob magic）
          git add -A -- ':(glob)**/audio/**'

          if git diff --cached --quiet; then
            echo "No generated audio changes."
          else
            git commit -m "Auto-generate TTS audio and manifests"
            git push
          fi

      - name: Check for missing audio
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          missing = []
          for file in sorted(Path('.').glob('*/audio/tts-missing.txt')):
              lines = [s.strip() for s in file.read_text(encoding='utf-8').splitlines() if s.strip()]
              if lines:
                  missing.append((str(file), lines))
          if missing:
              for filename, lines in missing:
                  print(f'::error file={filename}::{len(lines)} 条语音未生成')
                  for line in lines[:10]:
                      print('  -', line)
              raise SystemExit('存在未生成的语音，请查看日志并重新运行 workflow')
          print('所有已检测课程的语音生成成功。')
          PY